<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- Subtle top shine -->
  <rect width="512" height="260" rx="110" fill="url(#shine)"/>

  <!-- Split / fork icon -->
  <!-- Top stem -->
  <line x1="256" y1="95" x2="256" y2="255"
        stroke="white" stroke-width="56" stroke-linecap="round"/>
  <!-- Left branch -->
  <line x1="240" y1="242" x2="130" y2="370"
        stroke="white" stroke-width="56" stroke-linecap="round"/>
  <!-- Right branch -->
  <line x1="272" y1="242" x2="382" y2="370"
        stroke="white" stroke-width="56" stroke-linecap="round"/>

  <!-- Coin left -->
  <circle cx="130" cy="400" r="46" fill="white"/>
  <text x="130" y="417" font-family="system-ui,Arial,sans-serif"
        font-weight="900" font-size="46" text-anchor="middle" fill="#059669">₹</text>

  <!-- Coin right -->
  <circle cx="382" cy="400" r="46" fill="white"/>
  <text x="382" y="417" font-family="system-ui,Arial,sans-serif"
        font-weight="900" font-size="46" text-anchor="middle" fill="#059669">₹</text>
</svg>
